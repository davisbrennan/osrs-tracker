# nginx server block for rspill.com.
#
# Install to /etc/nginx/sites-available/osrs and symlink into sites-enabled.
# The upstream lives in its own file (/etc/nginx/conf.d/osrs-upstream.conf)
# because osrs-deploy rewrites it on every flip; keeping it out of this file
# means a deploy never rewrites your TLS or header configuration.
#
# Create the upstream file once before the first deploy:
#
#   upstream osrs_app {
#       server 127.0.0.1:3003;   # blue
#       keepalive 32;
#   }

server {
    listen 80;
    listen [::]:80;
    server_name rspill.com www.rspill.com;

    # Certbot's challenge path has to stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://rspill.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.rspill.com;

    ssl_certificate     /etc/letsencrypt/live/rspill.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rspill.com/privkey.pem;

    return 301 https://rspill.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rspill.com;

    ssl_certificate     /etc/letsencrypt/live/rspill.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rspill.com/privkey.pem;

    # No third-party anything: fonts are self-hosted at build time and there
    # is no analytics or ad script, which is what keeps the site out of
    # cookie-consent territory. The policy below is the enforcement of that
    # claim rather than a decoration — if something third-party is ever
    # added, this breaks first and loudly.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Next's build output is content-hashed, so it can be cached hard.
    location /_next/static/ {
        proxy_pass http://osrs_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://osrs_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
